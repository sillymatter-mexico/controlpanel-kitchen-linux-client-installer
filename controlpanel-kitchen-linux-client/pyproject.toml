[tool.poetry]
name = "controlpanel-kitchen-linux-client"
version = "0.1.3"
description = "Async Python client for the ControlPanel Kitchen API"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "cpk_sdk" }, { include = "cli" }, { include = "models" }, { include = "services" }]

[tool.poetry.dependencies]
python = "^3.12"
httpx = "^0.27"
pydantic = "^2.7"
pydantic-settings = "^2.3"
typer = "^0.25.1"
aiosqlite = "^0.22.1"
sqlalchemy = {version = ">=2.0", extras = ["asyncio"]}
websockets = ">=12.0"
alembic = "^1.18.4"
pystray = ">=0.19"
Pillow = ">=10.0"

[tool.poetry.scripts]
cpk = "cli.main:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-httpx = "^0.30"
datamodel-code-generator = { extras = ["http"], version = "^0.25" }
ruff = "^0.4"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = [".", "scripts"]


[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
